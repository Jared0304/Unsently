services:
  - type: web
    name: unsently
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/notes
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: unsently-data
      mountPath: /data
      sizeGB: 1
